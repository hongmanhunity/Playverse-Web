services:
  playverse-api:
    build: ./server
    container_name: playverse_backend
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production

  playverse-web:
    build: ./client
    container_name: playverse_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - playverse-api
