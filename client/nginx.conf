server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Chuyển tiếp mọi request /api/ vào container Backend (cổng 5000 nội bộ)
  location /api/ {
    proxy_pass http://playverse-api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  # Endpoint kiểm tra sức khỏe Backend
  location = /health {
    proxy_pass http://playverse-api:5000/health;
    proxy_set_header Host $host;
  }

  # SPA Fallback cho React Router (F5 không bị 404)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
